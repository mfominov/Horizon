name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests and configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.8"
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Run tests
        run: uv run pytest

      - name: Validate webhook dry-run
        env:
          OPENROUTER_MODEL: openai/gpt-4.1-mini
          HORIZON_WEBHOOK_URL: https://example.com/horizon-dry-run
        run: |
          set -euo pipefail
          uv run horizon-webhook \
            --config data/config.radars.example.json \
            --lang ru \
            --dry-run

  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan repository history
        run: gitleaks detect --source . --verbose --redact

  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.8"
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export locked runtime dependencies
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file requirements-audit.txt

      - name: Audit dependencies
        run: uvx --from pip-audit==2.9.0 pip-audit --requirement requirements-audit.txt

  image:
    name: Docker smoke and image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: horizon:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: CLI smoke
        run: >-
          docker run --rm
          --entrypoint /app/.venv/bin/horizon
          horizon:ci
          --help

      - name: Webhook dry-run smoke
        env:
          OPENROUTER_MODEL: openai/gpt-4.1-mini
          HORIZON_WEBHOOK_URL: https://example.com/horizon-dry-run
        run: |
          docker run --rm \
            --entrypoint /app/.venv/bin/horizon-webhook \
            -e OPENROUTER_MODEL \
            -e HORIZON_WEBHOOK_URL \
            horizon:ci \
            --config data/config.radars.example.json \
            --lang ru \
            --dry-run

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sudo sh -s -- -b /usr/local/bin v0.122.0

      - name: Scan image
        run: grype horizon:ci --only-fixed --fail-on high

  publish:
    name: Publish GHCR image
    needs: [tests, secrets, dependency-scan, image]
    if: >-
      github.event_name == 'push' &&
      (github.ref_name == github.event.repository.default_branch ||
      startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image_name: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image name
        id: image
        env:
          CONFIGURED_IMAGE: ${{ vars.GHCR_IMAGE }}
        run: |
          set -euo pipefail
          if [ -n "${CONFIGURED_IMAGE:-}" ]; then
            IMAGE_NAME="${CONFIGURED_IMAGE}"
          else
            IMAGE_NAME="ghcr.io/mfominov/horizon"
          fi
          case "${IMAGE_NAME}" in
            ghcr.io/*) ;;
            *)
              echo "GHCR_IMAGE must use the ghcr.io registry" >&2
              exit 1
              ;;
          esac
          echo "name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
